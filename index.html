<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2433" />
    <script>
      try {
        const savedTheme = localStorage.getItem('vpathfinder-theme')
        const theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#071923' : '#f7f9f8'
      } catch {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.style.colorScheme = 'light'
      }
    </script>
    <meta name="description" content="Vpathfinder Travel Solutions creates personalized domestic and international holidays, corporate travel, flights, hotels, and inbound tours from New Delhi." />
    <meta property="og:title" content="Vpathfinder Travel Solutions | Travel well." />
    <meta property="og:description" content="Thoughtfully planned journeys, end-to-end travel support, and customized holidays from New Delhi." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=85" />

</html>
